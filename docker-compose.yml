version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: scanner_db
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
      POSTGRES_DB: scanner_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "scanner"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: scanner_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://scanner:scanner@db:5432/scanner_db
      ALLOWED_ORIGINS: "http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
